name: Unmerged PR retirement guard

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  enforce-retirement-receipt:
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      - name: Load the guard from the protected default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Restore and reopen an unreceipted closure
        uses: actions/github-script@v7
        with:
          script: |
            const { guardUnmergedClosure } = require(`${process.env.GITHUB_WORKSPACE}/tools/pr-retirement-guard.js`);
            await guardUnmergedClosure({ github, context, core });
